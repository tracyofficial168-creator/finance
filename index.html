const fetchRates = async () => {
  const apis = [
    "https://open.er-api.com/v6/latest/USD",
    "https://api.exchangerate-api.com/v4/latest/USD",
  ];
  for (const url of apis) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      const r = data.rates || data.conversion_rates;
      if (r && r.VND) {
        const uv = r.VND;
        const rates = { VND: 1, USD: uv, USDT: uv, TWD: r.TWD ? uv/r.TWD : 810, AED: r.AED ? uv/r.AED : 6910, updatedAt: new Date().toISOString() };
        saveData(STORAGE_KEYS.rates, rates);
        return rates;
      }
    } catch(e) { /* try next */ }
  }
  const cached = loadData(STORAGE_KEYS.rates, null);
  return cached || { ...FALLBACK_RATES, updatedAt: null };
};

            </div>

          {/* ── Monthly Trend Chart (SVG) ── */}
          {monthlyTrend.some(m => m.inc > 0 || m.exp > 0) && (() => {
            const maxVal = Math.max(...monthlyTrend.map(m => Math.max(m.inc, m.exp)), 1);
            const chartH = 140, barW = 16, gap = 6;
            return (
              <div style={{ background:"#f8fafc", borderRadius:16, padding:"16px 18px", marginBottom:16 }}>
                <div style={{ fontSize:13, fontWeight:700, marginBottom:12 }}>{t("incExp6")}</div>

                  {monthlyTrend.map((m, i) => {
                    const x = i * (barW*2+gap+20) + 10;
                    const hInc = maxVal > 0 ? (m.inc / maxVal) * chartH : 0;
                    const hExp = maxVal > 0 ? (m.exp / maxVal) * chartH : 0;
                    return (
                      <g key={i}>
                        <rect x={x} y={chartH - hInc} width={barW} height={Math.max(hInc, 1)} rx={3} fill="#12B76A" />
                        <rect x={x+barW+gap} y={chartH - hExp} width={barW} height={Math.max(hExp, 1)} rx={3} fill="#F97066" />
                        <text x={x+barW+gap/2} y={chartH+16} textAnchor="middle" fill="#94a3b8" fontSize="10" fontFamily={F}>{m.label}</text>

                    );

                </div>
              </div>
            );
          })()}
          {/* ── Category Donut (SVG) ── */}
          {catPieData.length > 0 && (() => {
            const total = catPieData.reduce((s, d) => s + d.value, 0);
            const r = 55, ir = 30, cx = 65, cy = 65;
            let cumAngle = -90;
            const arcs = catPieData.map(d => {
              const angle = total > 0 ? (d.value / total) * 360 : 0;
              const startAngle = cumAngle;
              cumAngle += angle;
              const endAngle = cumAngle;
              const startRad = (startAngle * Math.PI) / 180;
              const endRad = (endAngle * Math.PI) / 180;
              const largeArc = angle > 180 ? 1 : 0;
              const x1 = cx + r * Math.cos(startRad), y1 = cy + r * Math.sin(startRad);
              const x2 = cx + r * Math.cos(endRad), y2 = cy + r * Math.sin(endRad);
              const ix1 = cx + ir * Math.cos(startRad), iy1 = cy + ir * Math.sin(startRad);
              const ix2 = cx + ir * Math.cos(endRad), iy2 = cy + ir * Math.sin(endRad);
              const path = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${ir} ${ir} 0 ${largeArc} 0 ${ix1} ${iy1} Z`;
              return { ...d, path };
            });
            return (
              <div style={{ background:"#f8fafc", borderRadius:16, padding:"16px 18px", marginBottom:16 }}>

                  </svg>
                  <div style={{ flex:1 }}>

                          <div style={{ fontSize:11, fontFamily:F, fontWeight:700, color:"#0f172a", flexShrink:0 }}>{pct}%</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

                      <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, fontWeight:600, marginBottom:3 }}>

            </div>

              const currencies = Object.entries(balances).filter(([,v]) => v !== 0);

              const walletTotalVND = currencies.reduce((s, [cur, amt]) => s + toVND(amt, cur), 0);

                  </div>
                  {hasDebt && <div style={{ fontSize:10, color:"#DC2626", fontWeight:600, marginTop:6, fontFamily:F }}>{t("inDebt")}</div>}
                </div>
              );
            })}

          </div>{/* end charts grid */}

                    <div style={{ fontSize:12, fontWeight:600, fontFamily:F, color:"#7A5AF8" }}>{formatVND(toVND(monthly, sv.currency))}/{lang==="vi"?"tháng":"mo"}</div>
                  </div>
                );
              })}
              <div style={{ fontSize:12, fontWeight:700, color:"#7A5AF8", textAlign:"right", marginTop:8, fontFamily:F }}>
                {t("total")}: {formatVND(savings.filter(sv=>sv.saved<sv.target).reduce((s, sv) => {
                  const contrib = sv.contribAmount || 0;
                  const freq = sv.contribFreq || "monthly";
                  let monthly;
                  if (contrib > 0) {
                    monthly = freq==="quarterly" ? contrib/3 : freq==="yearly" ? contrib/12 : contrib;
                  } else {
                    const remaining = sv.target - sv.saved;
                    const daysLeft = sv.deadline ? Math.max(1, Math.ceil((new Date(sv.deadline) - new Date()) / (1000*60*60*24))) : 365;
                    monthly = remaining / Math.max(1, Math.ceil(daysLeft / 30));
                  }
                  return s + toVND(monthly, sv.currency);
                }, 0))}/{lang==="vi"?"tháng":"mo"}
              </div>
            </div>
          )}
          {/* ── Financial Position Summary ── */}
          {(() => {
            const lendingAssetVND = (() => {
              const loanMap2 = {};
              transactions.forEach(tx => {
                if (tx.category==="lending"&&tx.type==="expense"&&tx.note) { const nm=tx.note.trim(); loanMap2[nm]=(loanMap2[nm]||0)+toVND(tx.amount,tx.currency); }
                if (tx.category==="loan_repay"&&tx.type==="income"&&tx.note) { const nm=tx.note.trim(); loanMap2[nm]=(loanMap2[nm]||0)-toVND(tx.amount,tx.currency); }
              });
              return Object.values(loanMap2).reduce((s,v)=>s+Math.max(0,v),0);
            })();
            const savingsAssetVND = savings.reduce((s,sv)=>s+toVND(sv.saved,sv.currency),0);
            const totalInvVND = investments.reduce((s,inv)=>s+toVND(inv.amount*(inv.currentPrice||inv.buyPrice||0),inv.currency),0);
            const totalLoanDebtVND = loans.reduce((s,l)=>{
              const mr = l.rateType==="year"?(l.rate||0)/100/12:(l.rate||0)/100;
              const ms = l.startDate?Math.max(0,Math.floor((new Date()-new Date(l.startDate))/(1000*60*60*24*30))):0;
              const interest = l.amount>0&&mr>0&&ms>0?l.amount*(Math.pow(1+mr,ms)-1):0;
              return s+toVND(Math.max(0,l.amount+interest-(l.paidAmount||0)),l.currency);
            },0);
            const walletTotalVND = Object.values(walletCurrentBalances).reduce((s,curs)=>{
              return s+Object.entries(curs).reduce((ss,[cur,amt])=>ss+toVND(amt,cur),0);
            },0);
            const netWorthVND = walletTotalVND + savingsAssetVND + lendingAssetVND + totalInvVND - totalLoanDebtVND;
            return (
              <div style={{ background:"linear-gradient(135deg,#f8fafc,#f1f5f9)", borderRadius:16, padding:"16px 18px", border:"1px solid #e2e8f0" }}>
                <div style={{ fontSize:13, fontWeight:700, marginBottom:10 }}>💎 {lang==="vi"?"Tổng quan tài chính":"Financial Position"}</div>
                {[
                  { l:lang==="vi"?"Nguồn tiền":"Wallets", v:walletTotalVND, c:"#12B76A", icon:"💰" },
                  { l:lang==="vi"?"Tiết kiệm":"Savings", v:savingsAssetVND, c:"#7A5AF8", icon:"🎯" },
                  { l:lang==="vi"?"Cho vay":"Lending", v:lendingAssetVND, c:"#F59E0B", icon:"🤝" },
                  { l:lang==="vi"?"Đầu tư":"Investments", v:totalInvVND, c:"#06B6D4", icon:"📊" },
                  { l:lang==="vi"?"Khoản vay":"Loans", v:-totalLoanDebtVND, c:"#DC2626", icon:"🏦" },
                ].map((r,i) => (
                  <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 10px" }}>
                    <span style={{ fontSize:12, color:"#64748b" }}>{r.icon} {r.l}</span>
                    <span style={{ fontSize:13, fontWeight:700, color:r.c, fontFamily:F }}>{r.v>=0?"+":""}{formatVND(r.v)}</span>
                  </div>
                ))}
                <div style={{ borderTop:"2px solid #e2e8f0", marginTop:8, paddingTop:8, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span style={{ fontSize:13, fontWeight:800, color:"#0f172a" }}>💎 {lang==="vi"?"Giá trị ròng":"Net Worth"}</span>
                  <span style={{ fontSize:16, fontWeight:800, fontFamily:F, color:netWorthVND>=0?"#12B76A":"#DC2626" }}>{formatVND(netWorthVND)}</span>
                </div>
              </div>
            );
          })()}
        </div>
      )}
      {/* ═══ INSURANCE ═══ */}
      {tab === "insurance" && (
        <div>
          <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
            <StatCard label={t("nextPayment")} value={formatVND(nextPaymentInsVND)} color="#06B6D4" bg="#ecfeff" />
            <StatCard label={t("totalYear")} value={formatVND(yearlyInsVND)} color="#0891B2" bg="#ecfeff" />
          </div>
          <button onClick={()=>setShowAddInsurance(true)} style={{ width:"100%", padding:12, border:"2px dashed #e2e8f0", borderRadius:14, cursor:"pointer", background:"transparent", color:"#94a3b8", fontWeight:600, fontSize:13, marginBottom:16, fontFamily:F }}>{t("addInsPolicy")}</button>
          {insurance.map(ins => {
            const person = people.find(p=>p.id===ins.insuredPerson);
            const daysUntilDue = ins.nextDue ? Math.ceil((new Date(ins.nextDue)-new Date())/(1000*60*60*24)) : null;
            const isUrgent = daysUntilDue !== null && daysUntilDue <= 30;
            const isPast = daysUntilDue !== null && daysUntilDue < 0;
            // Total paid calculation
            const freqMonths = ins.frequency === "semi-annual" ? 6 : 3;
            const monthsElapsed = ins.startDate ? Math.max(0, Math.floor((new Date() - new Date(ins.startDate)) / (1000*60*60*24*30))) : 0;
            const numPayments = Math.floor(monthsElapsed / freqMonths) + 1;
            const totalPaidVND = toVND(ins.premium * numPayments, ins.currency);
            return (
              <div key={ins.id} style={{ background:"#f8fafc", borderRadius:16, padding:"16px 18px", marginBottom:10, borderLeft:`4px solid ${ins.provider==="AIA"?"#DC2626":"#2563EB"}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
                      <span style={{ fontSize:11, fontWeight:800, color:ins.provider==="AIA"?"#DC2626":"#2563EB", background:ins.provider==="AIA"?"#fef2f2":"#eff6ff", padding:"2px 8px", borderRadius:6, fontFamily:F }}>{ins.provider}</span>
                      {person && <span style={{ fontSize:12 }}>{person.icon} {n(person.id)}</span>}
                    </div>
                    <div style={{ fontSize:14, fontWeight:700, fontFamily:F }}>{ins.policyName}</div>
                    {ins.note && <div style={{ fontSize:11, color:"#94a3b8", marginTop:2 }}>{ins.note}</div>}
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:14, fontWeight:700, fontFamily:F }}>{formatVND(toVND(ins.premium,ins.currency))}</div>
                    <div style={{ fontSize:10, color:"#94a3b8" }}>/{ins.frequency === "semi-annual" ? t("perHalf") : t("perQuarter")}</div>
                  </div>
                </div>
                <div style={{ display:"flex", gap:12, fontSize:11, color:"#64748b", flexWrap:"wrap" }}>
                  {ins.startDate && <span>{t("started")} {new Date(ins.startDate).toLocaleDateString("en-US")}</span>}
                  {ins.totalYears>0 && <span>{t("durationLabel")} {ins.totalYears} {t("years")}</span>}
                  <span style={{ background:"#f1f5f9", padding:"1px 8px", borderRadius:6, fontWeight:600 }}>{ins.frequency === "semi-annual" ? t("semiAnnual") : t("quarterly")}</span>
                </div>
                <div style={{ marginTop:6, fontSize:11, color:"#7A5AF8", fontWeight:600, fontFamily:F }}>
                  {lang==="vi"?"Đã đóng":"Total paid"}: {formatVND(totalPaidVND)} ({numPayments} {lang==="vi"?"kỳ":"payments"})
                </div>
                {ins.nextDue && (
                  <div style={{
                    marginTop:6, padding:"6px 12px", borderRadius:8, fontSize:12, fontWeight:600, fontFamily:F,
                    background: isPast?"#fef2f2":isUrgent?"#fffbeb":"#f0fdf4",
                    color: isPast?"#DC2626":isUrgent?"#D97706":"#16A34A",
                  }}>
                    {isPast ? `⚠️ ${t("overdue")} ${Math.abs(daysUntilDue)} ${t("daysLeft")}` :
                     isUrgent ? `⏰ ${daysUntilDue} ${t("daysLeft")} (${new Date(ins.nextDue).toLocaleDateString("en-US")})` :
                     `✓ ${t("nextDue")} ${new Date(ins.nextDue).toLocaleDateString("en-US")} (${daysUntilDue} ${t("daysLeft")})`}
                  </div>
                )}
                <div style={{ display:"flex", gap:8, marginTop:6 }}>
                  <button onClick={()=>editInsurance(ins)} style={{ border:"none", background:"none", color:"#cbd5e1", fontSize:10, cursor:"pointer", fontFamily:F }}>✎ {lang==="vi"?"Sửa":"Edit"}</button>
                  <button onClick={()=>saveIns(insurance.filter(x=>x.id!==ins.id))} style={{ border:"none", background:"none", color:"#cbd5e1", fontSize:10, cursor:"pointer", fontFamily:F }}>{t("del")}</button>
                </div>
              </div>
            );
          })}
          {insurance.length===0 && <div style={{ textAlign:"center", padding:36, color:"#94a3b8", fontSize:13 }}>{t("noInsurance")}</div>}
        </div>
      )}
      {/* ═══ LENDING ═══ */}
      {tab === "lending" && (() => {
        // Group lending transactions by borrower name (note field)
        const loanMap = {};
        transactions.forEach(tx => {
          if (tx.category === "lending" && tx.type === "expense" && tx.note) {
            const name = tx.note.trim();
            if (!loanMap[name]) loanMap[name] = { lent: [], repaid: [], firstDate: tx.date };
            loanMap[name].lent.push(tx);
            if (tx.date < loanMap[name].firstDate) loanMap[name].firstDate = tx.date;
          }
          if (tx.category === "loan_repay" && tx.type === "income" && tx.note) {
            const name = tx.note.trim();
            if (!loanMap[name]) loanMap[name] = { lent: [], repaid: [], firstDate: tx.date };
            loanMap[name].repaid.push(tx);
          }
        });
        const borrowers = Object.entries(loanMap).map(([name, data]) => {
          const totalLent = data.lent.reduce((s, tx) => s + toVND(tx.amount, tx.currency), 0);
          const totalRepaid = data.repaid.reduce((s, tx) => s + toVND(tx.amount, tx.currency), 0);
          const outstanding = totalLent - totalRepaid;
          // loanRates[name] can be number (old) or object (new)
          const lr = loanRates[name];
          const rate = typeof lr === "object" ? (lr?.rate||0) : (lr||0);
          const repayType = typeof lr === "object" ? (lr?.repayType||"flexible") : "flexible";
          const monthlyRepay = typeof lr === "object" ? (lr?.monthlyRepay||0) : 0;
          const daysSinceFirst = Math.max(0, Math.floor((new Date() - new Date(data.firstDate)) / (1000*60*60*24)));
          const monthsElapsed = Math.max(0, Math.floor(daysSinceFirst / 30));
          const monthlyRate = rate / 100;
          const interestAccrued = outstanding > 0 && rate > 0 && monthsElapsed > 0 ? outstanding * (Math.pow(1 + monthlyRate, monthsElapsed) - 1) : 0;
          const totalOwed = outstanding + interestAccrued;
          return { name, totalLent, totalRepaid, outstanding, rate, repayType, monthlyRepay, interestAccrued, totalOwed, monthsElapsed, daysSinceFirst, txCount: data.lent.length + data.repaid.length, allTx: [...data.lent, ...data.repaid].sort((a,b)=>new Date(b.date)-new Date(a.date)) };
        }).sort((a, b) => b.outstanding - a.outstanding);
        const totalOutstanding = borrowers.reduce((s, b) => s + b.totalOwed, 0);
        const totalInterest = borrowers.reduce((s, b) => s + b.interestAccrued, 0);
        return (
        <div>
          {/* Lending Summary - unique design */}
          <div style={{ background:"linear-gradient(135deg,#fffbeb,#fef3c7)", borderRadius:16, padding:"18px", marginBottom:16, border:"1px solid #fde68a" }}>
            <div style={{ fontSize:13, fontWeight:700, marginBottom:12, color:"#92400e" }}>🤝 {lang==="vi"?"Tổng quan cho vay":"Lending Overview"}</div>
            <div style={{ display:"flex", gap:12, marginBottom:10 }}>
              <div style={{ flex:1, background:"#fff", borderRadius:12, padding:"10px 14px", textAlign:"center" }}>
                <div style={{ fontSize:9, color:"#94a3b8", marginBottom:4 }}>{lang==="vi"?"Tổng cho vay":"Total Lent"}</div>
                <div style={{ fontSize:15, fontWeight:800, color:"#F97066", fontFamily:F }}>{formatVND(borrowers.reduce((s,b)=>s+b.totalLent,0))}</div>
              </div>
              <div style={{ flex:1, background:"#fff", borderRadius:12, padding:"10px 14px", textAlign:"center" }}>
                <div style={{ fontSize:9, color:"#94a3b8", marginBottom:4 }}>{lang==="vi"?"Đã thu":"Collected"}</div>
                <div style={{ fontSize:15, fontWeight:800, color:"#12B76A", fontFamily:F }}>{formatVND(borrowers.reduce((s,b)=>s+b.totalRepaid,0))}</div>
              </div>
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <div style={{ flex:1, background:"#fff", borderRadius:12, padding:"10px 14px", textAlign:"center" }}>
                <div style={{ fontSize:9, color:"#94a3b8", marginBottom:4 }}>{lang==="vi"?"Dư nợ gốc":"Outstanding"}</div>
                <div style={{ fontSize:15, fontWeight:800, color:"#F59E0B", fontFamily:F }}>{formatVND(totalOutstanding - totalInterest)}</div>
              </div>
              <div style={{ flex:1, background:"#fff", borderRadius:12, padding:"10px 14px", textAlign:"center" }}>
                <div style={{ fontSize:9, color:"#94a3b8", marginBottom:4 }}>{lang==="vi"?"Lãi tích lũy":"Interest"}</div>
                <div style={{ fontSize:15, fontWeight:800, color:"#7A5AF8", fontFamily:F }}>{formatVND(totalInterest)}</div>
              </div>
            </div>
            <div style={{ borderTop:"1px solid #fde68a", marginTop:12, paddingTop:10, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span style={{ fontSize:12, fontWeight:700, color:"#92400e" }}>💰 {t("loanAsset")}</span>
              <span style={{ fontSize:18, fontWeight:800, color:"#F59E0B", fontFamily:F }}>{formatVND(totalOutstanding)}</span>
            </div>
          </div>
          {borrowers.length === 0 && <div style={{ textAlign:"center", padding:36, color:"#94a3b8", fontSize:13 }}>{t("noLoans")}</div>}
          {borrowers.map(b => {
            const pctRepaid = b.totalLent > 0 ? Math.min((b.totalRepaid / b.totalLent) * 100, 100) : 0;
            const isPaidOff = b.outstanding <= 0;
            return (
              <div key={b.name} style={{ background:"#f8fafc", borderRadius:16, padding:"16px 18px", marginBottom:10, borderLeft:`4px solid ${isPaidOff?"#12B76A":"#F59E0B"}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
                  <div>
                    <div style={{ fontSize:14, fontWeight:700, fontFamily:F }}>{b.name}</div>
                    <div style={{ fontSize:11, color:"#94a3b8" }}>{b.txCount} {lang==="vi"?"giao dịch":"transactions"} · {b.monthsElapsed > 0 ? `${b.monthsElapsed} ${lang==="vi"?"tháng":"months"}` : `${b.daysSinceFirst} ${lang==="vi"?"ngày":"days"}`}</div>
                  </div>
                  {isPaidOff && <span style={{ fontSize:11, background:"#f0fdf4", color:"#12B76A", padding:"2px 10px", borderRadius:8, fontWeight:700 }}>✓ {lang==="vi"?"Đã trả hết":"Paid"}</span>}
                </div>
                <div style={{ display:"flex", gap:8, marginBottom:8, flexWrap:"wrap" }}>
                  <div style={{ background:"#fff", borderRadius:10, padding:"8px 12px", flex:1, minWidth:80 }}>
                    <div style={{ fontSize:9, color:"#94a3b8" }}>{t("lentTotal")}</div>
                    <div style={{ fontSize:13, fontWeight:700, color:"#F97066" }}>{formatVND(b.totalLent)}</div>
                  </div>
                  <div style={{ background:"#fff", borderRadius:10, padding:"8px 12px", flex:1, minWidth:80 }}>
                    <div style={{ fontSize:9, color:"#94a3b8" }}>{t("repaidTotal")}</div>
                    <div style={{ fontSize:13, fontWeight:700, color:"#12B76A" }}>{formatVND(b.totalRepaid)}</div>
                  </div>
                  <div style={{ background:"#fff", borderRadius:10, padding:"8px 12px", flex:1, minWidth:80 }}>
                    <div style={{ fontSize:9, color:"#94a3b8" }}>{t("outstanding")}</div>
                    <div style={{ fontSize:13, fontWeight:700, color:isPaidOff?"#12B76A":"#F59E0B" }}>{formatVND(b.outstanding)}</div>
                  </div>
                </div>
                {b.rate > 0 && b.outstanding > 0 && (
                  <div style={{ display:"flex", gap:8, marginBottom:8, flexWrap:"wrap" }}>
                    <div style={{ background:"#f5f3ff", borderRadius:10, padding:"8px 12px", flex:1 }}>
                      <div style={{ fontSize:9, color:"#94a3b8" }}>{lang==="vi"?"Lãi cộng dồn":"Compound Interest"}</div>
                      <div style={{ fontSize:13, fontWeight:700, color:"#7A5AF8" }}>+{formatVND(b.interestAccrued)}</div>
                    </div>
                    <div style={{ background:"#fffbeb", borderRadius:10, padding:"8px 12px", flex:1 }}>
                      <div style={{ fontSize:9, color:"#94a3b8" }}>{lang==="vi"?"Tổng phải trả":"Total Owed"}</div>
                      <div style={{ fontSize:13, fontWeight:700, color:"#F59E0B" }}>{formatVND(b.totalOwed)}</div>
                    </div>
                  </div>
                )}
                {/* Repayment progress */}
                <div style={{ height:6, background:"#e2e8f0", borderRadius:3, overflow:"hidden", marginBottom:8 }}>
                  <div style={{ height:"100%", borderRadius:3, width:`${pctRepaid}%`, background:isPaidOff?"#12B76A":"#F59E0B", transition:"width 0.3s" }} />
                </div>
                {/* Interest rate */}
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                  <span style={{ fontSize:11, color:"#64748b", fontFamily:F }}>{lang==="vi"?"Lãi %/tháng":"Int %/mo"}:</span>
                  <input type="number" value={b.rate} min="0" step="0.1" onChange={e => {
                    const old = typeof loanRates[b.name]==="object" ? loanRates[b.name] : {};
                    saveLR({ ...loanRates, [b.name]: { ...old, rate: parseFloat(e.target.value)||0 } });
                  }} style={{ width:55, padding:"4px 8px", border:"2px solid #e2e8f0", borderRadius:8, fontSize:12, fontFamily:F, outline:"none", textAlign:"center" }} />
                  <span style={{ fontSize:11, color:"#94a3b8" }}>%</span>
                </div>
                {/* Repayment schedule */}
                <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4, flexWrap:"wrap" }}>
                  <span style={{ fontSize:11, color:"#64748b", fontFamily:F }}>{lang==="vi"?"Thu nợ":"Repay"}:</span>
                  {[{v:"monthly",l:lang==="vi"?"Hàng tháng":"Monthly"},{v:"flexible",l:lang==="vi"?"Linh hoạt":"Flexible"}].map(opt => (
                    <button key={opt.v} onClick={() => {
                      const old = typeof loanRates[b.name]==="object" ? loanRates[b.name] : { rate: b.rate };
                      saveLR({ ...loanRates, [b.name]: { ...old, repayType: opt.v } });
                    }} style={{
                      padding:"3px 10px", border:b.repayType===opt.v?"2px solid #F59E0B":"1px solid #e2e8f0",
                      borderRadius:6, cursor:"pointer", fontSize:10, fontWeight:b.repayType===opt.v?700:500, fontFamily:F,
                      background:b.repayType===opt.v?"#fffbeb":"#fafbfc", color:b.repayType===opt.v?"#F59E0B":"#94a3b8",
                    }}>{opt.l}</button>
                  ))}
                </div>
                {b.repayType === "monthly" && (
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                    <span style={{ fontSize:11, color:"#64748b", fontFamily:F }}>{lang==="vi"?"Trả/tháng":"Per mo"}:</span>
                    <input type="number" value={b.monthlyRepay} min="0" onChange={e => {
                      const old = typeof loanRates[b.name]==="object" ? loanRates[b.name] : { rate: b.rate };
                      saveLR({ ...loanRates, [b.name]: { ...old, monthlyRepay: parseFloat(e.target.value)||0 } });
                    }} style={{ width:90, padding:"4px 8px", border:"2px solid #e2e8f0", borderRadius:8, fontSize:12, fontFamily:F, outline:"none", textAlign:"center" }} />
                    {b.monthlyRepay > 0 && b.outstanding > 0 && (
                      <span style={{ fontSize:10, color:"#94a3b8" }}>≈ {Math.ceil(b.totalOwed / b.monthlyRepay)} {lang==="vi"?"tháng":"mo"}</span>
                    )}
                  </div>
                )}
                {b.rate > 0 && b.outstanding > 0 && (
                  <div style={{ fontSize:10, color:"#7A5AF8", fontFamily:F, background:"#f5f3ff", padding:"4px 10px", borderRadius:6, marginTop:4 }}>
                    {lang==="vi"?"Lãi kép":"Compound"}: {b.rate}%/{lang==="vi"?"tháng":"mo"} × {b.monthsElapsed} {lang==="vi"?"tháng":"months"} = {formatVND(b.interestAccrued)}
                  </div>
                )}
                {/* Transaction list */}
                <details style={{ marginTop:8 }}>
                  <summary style={{ fontSize:11, color:"#6366f1", cursor:"pointer", fontFamily:F, fontWeight:600 }}>
                    📋 {b.txCount} {lang==="vi"?"giao dịch":"transactions"}
                  </summary>
                  <div style={{ marginTop:6 }}>
                    {b.allTx.map(tx => (
                      <div key={tx.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 8px", borderBottom:"1px solid #f1f5f9", fontSize:11 }}>
                        <div style={{ flex:1 }}>
                          <span style={{ color:tx.type==="expense"?"#F97066":"#12B76A", fontWeight:700 }}>
                            {tx.type==="expense"?"−":"+"}{formatCurrency(tx.amount, tx.currency)}
                          </span>
                          <span style={{ color:"#94a3b8", marginLeft:6 }}>{new Date(tx.date).toLocaleDateString("en-US")}</span>
                        </div>
                        <div style={{ display:"flex", gap:6 }}>
                          <button onClick={()=>editTransaction(tx)} style={{ border:"none", background:"none", color:"#6366f1", fontSize:10, cursor:"pointer", fontFamily:F }}>✎</button>
                          <button onClick={()=>saveTx(transactions.filter(t2=>t2.id!==tx.id))} style={{ border:"none", background:"none", color:"#cbd5e1", fontSize:10, cursor:"pointer", fontFamily:F }}>✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </details>
              </div>
            );
          })}
          <div style={{ fontSize:11, color:"#94a3b8", textAlign:"center", padding:12, fontFamily:F }}>
            {lang==="vi"
              ? "Thêm khoản cho vay: vào Giao dịch → Chi tiêu → danh mục \"Cho vay\" → ghi tên người vay vào Note"
              : "To add a loan: go to Transactions → Expense → category \"Lending\" → write borrower name in Note"}
          </div>
        </div>
        );
      })()}
      {/* ═══ LOANS ═══ */}

            {walletEditForm.amount && walletEditForm.currency !== reportCur && (
              <div style={{ fontSize:11, color:"#64748b", marginTop:-10, marginBottom:12, fontFamily:F }}>
                ≈ {formatVND(toVND(parseFloat(walletEditForm.amount) || 0, walletEditForm.currency))}
              </div>
            )}
            <Btn onClick={addWalletBalance}>{t("addUpdateBal")}</Btn>
          </>
        )}
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
